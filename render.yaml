# Render 배포 설정 — 대회 무중단 요건(9/7 11:00 ~ 9/11 23:59) 대비.
#
# 주의: free 플랜은 15분 무접속 시 인스턴스가 잠들어 첫 접속이 콜드스타트/타임아웃이 된다.
#       심사위원이 처음 여는 순간이 그 콜드스타트일 수 있으므로 반드시 유료 플랜을 쓴다.
#       (결격 사유이므로 월 몇 달러를 아낄 자리가 아니다.)
services:
  - type: web
    name: nl2order-harness
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: starter          # free 금지 — idle 슬립으로 첫 접속이 실패한다
    region: singapore      # 심사가 한국에서 이뤄지므로 지연이 가장 낮다
    healthCheckPath: /api/health
    autoDeploy: false      # 심사 기간 중 의도치 않은 재배포로 다운타임이 생기지 않도록
    envVars:
      - key: NODE_ENV
        value: production
      - key: SMOKE_DIR
        value: ./data
      - key: TRUST_PROXY_HOPS
        value: "1"         # Render 는 프록시 1홉. 직접 노출이면 0.
      - key: DAILY_CALL_CAP
        value: "20000"     # 심사 5일 + 팀 테스트를 견디는 값. 기본 500 은 하루 250 파싱뿐이라 부족하다.
      - key: RATE_PER_MIN
        value: "30"
      - key: LLM_TIMEOUT_MS
        value: "60000"
      - key: OPENROUTER_API_KEY
        sync: false        # 대시보드에서 직접 입력 — 절대 커밋하지 않는다
